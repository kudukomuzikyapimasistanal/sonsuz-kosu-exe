<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sonsuz Koşu</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--ink:#fff;--panel:rgba(60,15,40,.72);--gem:#4fe3ff}
html,body{height:100%;margin:0;overflow:hidden;background:#3b1450;font-family:Georgia,'Times New Roman',serif;color:var(--ink);touch-action:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 20px;pointer-events:none;text-shadow:0 2px 6px rgba(40,0,30,.8),0 0 2px #000}
#gems{display:flex;align-items:center;gap:10px;font-size:44px;font-weight:bold}
#gems svg{width:30px;height:46px;filter:drop-shadow(0 0 6px #4fe3ff)}
#time{font-size:22px;letter-spacing:1px;position:absolute;left:50%;transform:translateX(-50%);top:4px}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,8,40,.35)}
#ov.hide{display:none}
.box{background:var(--panel);padding:28px 36px;border-radius:14px;text-align:center;max-width:320px;border:1px solid rgba(255,200,120,.4)}
.box h1{margin:0 0 8px;font-size:34px}
.box p{margin:6px 0;font-size:16px;line-height:1.4}
button{margin-top:14px;font:inherit;font-size:20px;padding:10px 28px;border:0;border-radius:10px;background:#ffb347;color:#4a1530;cursor:pointer;font-weight:bold}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div id="gems"><svg viewBox="0 0 30 46"><polygon points="15,0 28,14 22,46 8,46 2,14" fill="#4fe3ff" stroke="#bff6ff" stroke-width="2"/></svg><span id="g">0</span></div>
  <div id="time">0:00</div>
  <div></div>
</div>
<div id="ov"><div class="box">
  <h1 id="t">Sonsuz Koşu</h1>
  <p id="m">Kaşif kendiliğinden koşar. Şeritler arasında geç, taşların üstünden zıpla, kristalleri topla.</p>
  <p>← → veya A D: şerit<br>Boşluk / ↑: zıpla<br>Dokunmatik: kaydır</p>
  <button id="b">Başla</button>
</div></div>
<script src="node_modules/three/build/three.min.js"></script>
<script>
(function(){
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(60,1,.1,800);
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

// sky
(function(){const k=document.createElement('canvas');k.width=1024;k.height=512;const x=k.getContext('2d');
const g=x.createLinearGradient(0,0,0,512);
[[0,'#3d1566'],[.1,'#7a2a78'],[.2,'#d2406a'],[.28,'#ff6a4a'],[.34,'#ff9a3c'],[.375,'#ffd27a'],[.4,'#e0703f'],[1,'#e0703f']].forEach(a=>g.addColorStop(a[0],a[1]));
x.fillStyle=g;x.fillRect(0,0,1024,512);
for(let i=0;i<60;i++){const cx=Math.random()*1024,cy=12+Math.random()*140,w=50+Math.random()*190,h=4+Math.random()*11;
 x.fillStyle='rgba('+(Math.random()<.5?'255,120,90':'200,60,100')+','+(.12+Math.random()*.2)+')';x.beginPath();x.ellipse(cx,cy,w,h,-.05,0,7);x.fill();
 x.fillStyle='rgba(255,205,125,.2)';x.beginPath();x.ellipse(cx,cy-h*.5,w*.8,h*.3,-.05,0,7);x.fill()}
const sg=x.createRadialGradient(512,192,3,512,192,190);sg.addColorStop(0,'rgba(255,252,220,1)');sg.addColorStop(.07,'rgba(255,238,170,.95)');sg.addColorStop(.25,'rgba(255,190,90,.5)');sg.addColorStop(1,'rgba(255,140,60,0)');
x.fillStyle=sg;x.fillRect(0,0,1024,512);
S.background=new THREE.CanvasTexture(k)})();
S.fog=new THREE.Fog(0xe0703f,45,185);

// lights
S.add(new THREE.AmbientLight(0xffb48a,.55));
const sun=new THREE.DirectionalLight(0xffc27a,.9);sun.position.set(-6,8,-20);S.add(sun);
const fill=new THREE.DirectionalLight(0xffe2b0,.6);fill.position.set(0,5,14);S.add(fill);

// ground + road
const gk=document.createElement('canvas');gk.width=gk.height=256;const gx=gk.getContext('2d');
gx.fillStyle='#5a8a2c';gx.fillRect(0,0,256,256);
for(let i=0;i<60;i++){gx.fillStyle='rgba('+(Math.random()<.5?'40,80,20':'120,150,50')+','+(.1+Math.random()*.15)+')';gx.beginPath();gx.ellipse(Math.random()*256,Math.random()*256,6+Math.random()*22,4+Math.random()*12,Math.random()*3,0,7);gx.fill()}
const gp=['#4a7a22','#6f9a32','#3d6a1f','#8aae3e','#a6b84a'];gx.lineWidth=1.3;
for(let i=0;i<3200;i++){const px=Math.random()*256,py=Math.random()*256;gx.strokeStyle=gp[(Math.random()*gp.length)|0];gx.beginPath();gx.moveTo(px,py);gx.lineTo(px+(Math.random()-.5)*4,py-3-Math.random()*5);gx.stroke()}

const gr=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshLambertMaterial({map:gt}));
gr.rotation.x=-Math.PI/2;gr.position.y=-.02;S.add(gr);

x.globalAlpha=1;
// tekerlek izi
[150,360].forEach(c=>{const g=x.createLinearGradient(c-34,0,c+34,0);g.addColorStop(0,'rgba(60,35,18,0)');g.addColorStop(.5,'rgba(60,35,18,.38)');g.addColorStop(1,'rgba(60,35,18,0)');x.fillStyle=g;x.fillRect(c-34,0,68,512)});

  x.fillStyle=['#b69470','#9a8068','#c4a37a','#7d6a58'][(Math.random()*4)|0];x.beginPath();x.ellipse(px,py,r,r*.7,Math.random()*3,0,7);x.fill()}

for(let i=0;i<150;i++){x.strokeStyle='rgba(150,120,50,.55)';x.lineWidth=1;const px=Math.random()*512,py=Math.random()*512;x.beginPath();x.moveTo(px,py);x.lineTo(px+(Math.random()-.5)*8,py+(Math.random()-.5)*8);x.stroke()}

const tex=cobble();

road.rotation.x=-Math.PI/2;road.position.z=-150;S.add(road);

pelvis.add(ball(.26,PANT,1.05,.5,.28));
const torso=new THREE.Group();torso.position.y=.1;pelvis.add(torso);
const chest=new THREE.Mesh(new THREE.CylinderGeometry(.4,.28,.75,16),SHIRT);chest.scale.z=.62;chest.position.y=.38;torso.add(chest);
const shoulders=ball(.42,SHIRT,1,.45,.65);shoulders.position.y=.7;torso.add(shoulders);
const neck=new THREE.Mesh(new THREE.CylinderGeometry(.09,.1,.16,10),SKIN);neck.position.y=.86;torso.add(neck);
const headG=new THREE.Group();headG.position.y=1.0;torso.add(headG);
const skull=ball(.2,SKIN,.95,1.15,1.05);skull.position.y=.1;headG.add(skull);
const nose=ball(.035,SKIN);nose.position.set(0,.08,-.21);headG.add(nose);
[-1,1].forEach(s=>{const e=ball(.04,SKIN,.5,1,.8);e.position.set(s*.19,.1,0);headG.add(e)});
const hair=ball(.215,HAIR);hair.position.set(0,.17,.03);hair.scale.set(.98,.82,1.02);headG.add(hair);
const tuft=ball(.12,HAIR,1,.7,1);tuft.position.set(0,.32,-.02);headG.add(tuft);
function arm(s){const sh=new THREE.Group();sh.position.set(s*.46,.68,0);torso.add(sh);
 sh.add(ball(.1,SKIN));sh.add(seg(.085,.07,.5,SKIN));
 const el=new THREE.Group();el.position.y=-.5;sh.add(el);el.add(seg(.07,.055,.46,SKIN));
 const h=ball(.07,SKIN);h.position.y=-.5;el.add(h);return{sh,el}}
const aL=arm(-1),aR=arm(1);
function leg(s){const hp=new THREE.Group();hp.position.set(s*.17,-.05,0);pelvis.add(hp);
 hp.add(seg(.13,.1,.52,PANT));const kn=new THREE.Group();kn.position.y=-.52;hp.add(kn);kn.add(seg(.11,.08,.5,PANT));
 const f=new THREE.Mesh(new THREE.BoxGeometry(.17,.12,.34),BOOT);f.position.set(0,-.54,-.06);kn.add(f);return{hp,kn}}

    for(let i=0;i<7;i++)g.add(M(BX(.7,.5,.1),mStoneD,-3+i,.6+h+.9,-1.03));
    const pd=M(CY(1.6,1.6,2,3),mStone,0,.6+h+2.3,0);pd.rotation.x=Math.PI/2;pd.rotation.y=Math.PI/2;pd.scale.set(1.3,1,1);g.add(pd)}
  else{g.add(M(BX(4.4,.8,2),mStone,-2.1,.6+h+.9,0));const r=M(BX(2.2,.8,1.4),mStoneD,2,.4,1.5);r.rotation.y=.5;g.add(r)}
  return g}
function arch(){const g=new THREE.Group();
  [-3.1,3.1].forEach(x=>{g.add(M(BX(1.5,8,1.5),mStone,x,4,0));g.add(M(BX(2,.5,2),mStoneD,x,.25,0))});
  const t=M(new THREE.TorusGeometry(3.1,.75,8,28,Math.PI),mStone,0,8,0);t.scale.z=1.6;g.add(t);
  g.add(M(BX(1.2,1.4,1.7),mStoneD,0,11.4,0));return g}
function torch(){const g=new THREE.Group();
  g.add(M(CY(.18,.26,1.3,10),mStoneD,0,.65,0),M(CY(.5,.28,.32,12),mStone,0,1.45,0));
  const fm=new THREE.MeshBasicMaterial({color:0xff8a2a,transparent:true,opacity:.85,fog:false});
  const f=M(new THREE.ConeGeometry(.3,1,8),fm,0,2.1,0);g.add(f);
  g.add(M(new THREE.ConeGeometry(.17,.6,8),new THREE.MeshBasicMaterial({color:0xffe9a0,fog:false}),0,1.95,0));
  g.userData.flame=f;return g}
function rock(){const r=.28+Math.random()*.5,g=new THREE.Group();
  const m=M(rockG[(Math.random()*5)|0],Math.random()<.5?mStone:mStoneD,0,r*.5,0);m.scale.setScalar(r);m.rotation.y=Math.random()*6;g.add(m);
  const sk=M(gMud,mMud,0,.03,0);sk.scale.set(r*1.5,.1,r*1.35);g.add(sk);return g}
function pipe(len,rad){const g=new THREE.Group();g.add(M(CY(rad,rad,len,22),mPipe));
  [-1,1].forEach(sg=>{const y=sg*(len/2-.07);g.add(M(CY(rad*1.25,rad*1.25,.14,22),mFl,0,y,0));
    for(let i=0;i<8;i++){const a=i/8*6.283;g.add(M(CY(.05,.05,.18,6),mFl,Math.cos(a)*rad*1.12,y,Math.sin(a)*rad*1.12))}
    const d=M(new THREE.CircleGeometry(rad*.88,20),mDark,0,sg*(len/2+.003),0);d.rotation.x=sg>0?-Math.PI/2:Math.PI/2;g.add(d)});
  g.add(M(CY(rad*1.12,rad*1.12,.1,22),mFl,0,0,0));g.rotation.z=Math.PI/2;return g}
function pipeStack(){const g=new THREE.Group();
  [[-.55,.5],[.55,.5],[0,1.4]].forEach(a=>{const p=pipe(4,.5);p.position.set(0,a[1],a[0]);g.add(p)});
  const sk=M(gMud,mMud,0,.03,0);sk.scale.set(2.6,.1,1.9);g.add(sk);g.rotation.y=Math.random()*3;return g}
function makeObstacle(){const g=new THREE.Group(),r=Math.random();
  const mud=M(gMud,mMud,0,.03,0);
  if(r<.4){for(let row=0;row<3;row++){const odd=row%2,xs=odd?[-.5,0,.5]:[-.75,-.25,.25,.75];
      xs.forEach(x=>{if(row===2&&Math.random()<.4)return;const b=M(BX(.49,.29,.95),Math.random()<.5?mStone:mStoneD,x+(Math.random()-.5)*.04,.15+row*.3,(Math.random()-.5)*.1);b.rotation.y=(Math.random()-.5)*.12;g.add(b)});
      if(odd){g.add(M(BX(.24,.29,.95),mStoneD,-.88,.15+row*.3,0),M(BX(.24,.29,.95),mStone,.88,.15+row*.3,0))}}
    mud.scale.set(1.3,.1,.8);g.add(mud)}
  else if(r<.75){const p=pipe(2.1,.36);p.position.y=.46;g.add(p);
    mud.scale.set(1.5,.1,.75);g.add(mud);
    [-.7,.8].forEach(x=>{const k=rock();k.position.set(x,0,.5);k.scale.multiplyScalar(.55);g.add(k)})}
  else{for(let i=0;i<7;i++){const k=rock();k.position.x=(Math.random()-.5)*1.7;k.position.z=(Math.random()-.5)*.8;k.scale.multiplyScalar(.9);g.add(k)}}
  return g}

const decor=[],DEPTH=200,sd=()=>(Math.random()<.5?-1:1);
function addD(g,rx,x,z){g.position.set(x,0,z);g.userData.rx=rx;S.add(g);decor.push(g)}
for(let i=0;i<9;i++)addD(column(3+Math.random()*4,Math.random()<.35),7,sd()*(7+Math.random()*10),-i*22-Math.random()*10);
for(let i=0;i<3;i++)addD(temple(4+Math.random()*2,i===1),17,sd()*(17+Math.random()*6),-i*66-30);
for(let i=0;i<2;i++)addD(arch(),12,sd()*(12+Math.random()*3),-i*95-50);
for(let i=0;i<16;i++){addD(torch(),0,-5.6,-i*12-2);addD(torch(),0,5.6,-i*12-8)}
for(let i=0;i<30;i++){const k=rock();k.scale.multiplyScalar(1.2);addD(k,6,sd()*(6+Math.random()*20),-Math.random()*DEPTH)}
function grassTuft(){const g=new THREE.Group(),c=[0x5f8f2f,0x7aa33a,0x4a7a22];
  for(let i=0;i<7;i++){const b=M(new THREE.ConeGeometry(.07,.5+Math.random()*.5,4),new THREE.MeshLambertMaterial({color:c[i%3]}),(Math.random()-.5)*.5,.3,(Math.random()-.5)*.5);b.rotation.set((Math.random()-.5)*.5,0,(Math.random()-.5)*.5);g.add(b)}return g}
for(let i=0;i<70;i++)addD(grassTuft(),5,sd()*(5+Math.random()*25),-Math.random()*DEPTH);
for(let i=0;i<6;i++)addD(pipeStack(),8,sd()*(8+Math.random()*10),-i*33-10);
// yol kenarı
const mDirt=new THREE.MeshLambertMaterial({color:0x6e4a2c});[-4.7,4.7].forEach(x=>{const b=M(BX(.7,.2,400),mDirt,x,.08,-150);S.add(b)});
// ufuktaki harabeler
const sil=new THREE.Group(),mSil=new THREE.MeshBasicMaterial({color:0x7a2f6a,fog:false});
for(let i=0;i<40;i++){const w=4+Math.random()*9,h=5+Math.random()*20,sx=(Math.random()-.5)*600;if(Math.abs(sx)<25)continue;sil.add(M(BX(w,h,w),mSil,sx,h/2-1,-380+Math.random()*10))}S.add(sil);
// kor ve toz
const NP=220,pg=new THREE.BufferGeometry(),pp=new Float32Array(NP*3);
for(let i=0;i<NP;i++){pp[i*3]=(Math.random()-.5)*30;pp[i*3+1]=.3+Math.random()*7;pp[i*3+2]=-Math.random()*120+8}
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xffd9a0,size:.14,transparent:true,opacity:.75,depthWrite:false}));pts.frustumCulled=false;S.add(pts);

const LANE=[-2.5,0,2.5];
let items=[],st='ready',speed,gems,time,lane,px,py,vy,spawnD,shake,runT;
const $=id=>document.getElementById(id);

function clearItems(){items.forEach(o=>S.remove(o.m));items=[]}
function reset(){clearItems();speed=14;gems=0;time=0;lane=1;px=0;py=0;vy=0;spawnD=0;shake=0;runT=0;$('g').textContent=0;$('time').textContent='0:00'}
function spawn(){
  const z=-130;const free=(Math.random()*3)|0;const blocked=[0,1,2].filter(l=>l!==free);
  const nb=Math.random()<.35?2:1;
  const bl=nb===2?blocked:[blocked[(Math.random()*2)|0]];
  bl.forEach(l=>{const g=makeObstacle();g.position.set(LANE[l],0,z);S.add(g);items.push({m:g,t:'o',l})});
  if(Math.random()<.8){const gl=free;const n=5;for(let i=0;i<n;i++){const m=new THREE.Mesh(gGem,mGem);m.scale.y=1.5;m.add(new THREE.Mesh(gGlow,mGlow));m.position.set(LANE[gl],1,z-i*2.2);S.add(m);items.push({m,t:'g',l:gl})}}
}
function jump(){if(st==='run'&&py<=.01){vy=11.5}}
function go(d){if(st==='run')lane=Math.max(0,Math.min(2,lane+d))}
function start(){reset();st='run';$('ov').classList.add('hide')}
function over(){st='over';shake=.6;$('t').textContent='Yakalandın';
  const s=Math.floor(time);$('m').textContent=gems+' kristal topladın, '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' koştun.';$('b').textContent='Tekrar dene';$('ov').classList.remove('hide');$('b').focus()}
$('b').onclick=start;
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')go(-1);
  else if(e.code==='ArrowRight'||e.code==='KeyD')go(1);
  else if(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW'){e.preventDefault();jump()}
  else if(e.code==='Enter'&&st!=='run')start()});
let tx=0,ty=0;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>25)go(dx>0?1:-1);else if(dy<-25)jump()},{passive:true});

reset();
let last=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min((now-last)/1000,.05);last=now;
  const run=st==='run';
  if(run){
    time+=dt;speed=Math.min(14+time*.18,32);runT+=dt*speed*.55;
    spawnD+=speed*dt;if(spawnD>speed*1.15+14){spawnD=0;spawn()}
    px+=(LANE[lane]-px)*Math.min(1,dt*12);
    vy-=30*dt;py+=vy*dt;if(py<0){py=0;vy=0}
    tex.offset.y-=speed*dt/(400/14);gt.offset.y-=speed*dt/3; // scroll cobbles toward camera
    items.forEach(o=>{o.m.position.z+=speed*dt;
      if(o.t==='g'){o.m.rotation.y+=dt*3}
      const z=o.m.position.z;
      if(o.t==='o'&&Math.abs(z)<.9&&o.l===lane&&py<.8)over();
      else if(o.t==='g'&&!o.dead&&Math.abs(z)<.9&&o.l===lane&&py<2.2){o.dead=1;S.remove(o.m);gems++;$('g').textContent=gems}});
    items=items.filter(o=>!o.dead&&o.m.position.z<8||(o.m.position.z>=8&&(S.remove(o.m),false)));
    decor.forEach(d=>{d.position.z+=speed*dt;if(d.position.z>14){d.position.z-=DEPTH;if(d.userData.rx)d.position.x=(Math.random()<.5?-1:1)*(d.userData.rx+Math.random()*10)}
      const f=d.userData.flame;if(f){f.scale.set(1+Math.sin(now*.03+d.position.x)*.12,1+Math.sin(now*.021+d.position.z)*.28,1)}});
    const s=Math.floor(time);$('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  }
  {const sp=run?speed:2,a=pg.attributes.position.array;
   for(let i=0;i<NP;i++){a[i*3+2]+=sp*dt;a[i*3+1]+=Math.sin(now*.001+i)*dt*.3;a[i*3]+=Math.cos(now*.0007+i)*dt*.4;
     if(a[i*3+2]>8){a[i*3+2]-=128;a[i*3]=(Math.random()-.5)*30;a[i*3+1]=.3+Math.random()*7}}
   pg.attributes.position.needsUpdate=true}
  // animation
  const ph=runT*1.3,sw=Math.sin(ph);
  airT+=((py>.05?1:0)-airT)*Math.min(1,dt*14);
  const k=airT,mx=(a,b)=>a*(1-k)+b*k,kf=q=>(1+Math.sin(q-1.2))*.7;
  legL.hp.rotation.x=mx(sw*.95,1.0);legL.kn.rotation.x=-mx(kf(ph),1.3);
  legR.hp.rotation.x=mx(-sw*.95,-.45);legR.kn.rotation.x=-mx(kf(ph+Math.PI),.9);
  aL.sh.rotation.x=mx(-sw*.9,2.3);aR.sh.rotation.x=mx(sw*.9,1.7);
  aL.el.rotation.x=mx(1.3+.2*sw,.4);aR.el.rotation.x=mx(1.3-.2*sw,.4);
  aL.sh.rotation.z=.1;aR.sh.rotation.z=-.1;
  torso.rotation.x=mx(-.22,-.05);torso.rotation.y=mx(sw*.14,0);headG.rotation.x=mx(.16,.05);
  bill.position.y=pelvis.position.y+BH/2-.05;bill.rotation.z=Math.sin(ph)*.03*(1-k);bill.scale.y=1+Math.abs(Math.cos(ph))*.012*(1-k);
  pelvis.position.y=1.17+(run?mx(Math.abs(Math.cos(ph))*.09,0):0);
  P.position.set(px,py,0);P.rotation.z=(LANE[lane]-px)*-.05;P.rotation.y=(LANE[lane]-px)*-.08;
  blob.position.x=px;blob.scale.setScalar(Math.max(.4,1-py*.2));
  cam.fov=60+(run?(speed-14)*.35:0);cam.updateProjectionMatrix();
  shake=Math.max(0,shake-dt);
  cam.position.set(px*.6+(Math.random()-.5)*shake*.6,3.4+py*.35,6.2);
  cam.lookAt(px*.3,1.5,-8);
  R.render(S,cam);
}
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
